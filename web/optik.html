<title>Optik Sınav Koçu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an optical answer form (optik form) as the study desk — paper surface, pink guide ink, answer bubbles as the core control. Sticky header, tabbed views, a full-screen player for sessions, one card = one step. */
:root{
  --bg:#F6F7F9; --paper:#FFFFFF; --ink:#1C2333; --muted:#5E6678; --line:#E4E1E6;
  --guide:#C8325A; --guide-soft:#FBE6EC; --guide-line:#F1BFCD;
  --mark:#F3D34A; --mark-soft:#FDF5D3; --ok:#1E8E5A; --ok-soft:#DFF3E8; --bad:#C23B2E; --bad-soft:#FBE3E0; --warn:#B7791F; --warn-soft:#FBF0DC;
  --blue:#3B5BDB; --blue-soft:#E6EBFB; --teal:#0F8A8A; --violet:#6B5B95;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141A; --paper:#1A1D25; --ink:#E7E9EF; --muted:#9CA3B4; --line:#2B2F3A;
  --guide:#F0728F; --guide-soft:#3A1E28; --guide-line:#5A2C3B;
  --mark:#E9C93E; --mark-soft:#3A3318; --ok:#4CC38A; --ok-soft:#173528; --bad:#F07264; --bad-soft:#3A1E1B; --warn:#E3A84A; --warn-soft:#3A2D17;
  --blue:#7C97FF; --blue-soft:#1E2742; --teal:#3CC3C3; --violet:#A894D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141A; --paper:#1A1D25; --ink:#E7E9EF; --muted:#9CA3B4; --line:#2B2F3A;
  --guide:#F0728F; --guide-soft:#3A1E28; --guide-line:#5A2C3B;
  --mark:#E9C93E; --mark-soft:#3A3318; --ok:#4CC38A; --ok-soft:#173528; --bad:#F07264; --bad-soft:#3A1E1B; --warn:#E3A84A; --warn-soft:#3A2D17;
  --blue:#7C97FF; --blue-soft:#1E2742; --teal:#3CC3C3; --violet:#A894D6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--guide)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--guide);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand .dots{display:flex;gap:3px}
.brand .dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--guide)}
.brand .dots i.f{background:var(--guide)}
.hdr-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.count{font-family:var(--f-mono);font-size:.82rem;color:var(--guide);font-weight:700;white-space:nowrap}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}

nav.tabs{max-width:1120px;margin:0 auto;display:flex;gap:2px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow-x:auto}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:9px 12px 10px;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:7px}
nav.tabs a svg{width:18px;height:18px}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--guide)}
@media (max-width:759px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);max-width:none;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);overflow:visible}
  nav.tabs a{flex-direction:column;gap:2px;font-size:.64rem;padding:8px 2px 7px;border-bottom:0;border-top:2.5px solid transparent;flex:1;min-width:0}
  nav.tabs a.on{border-top-color:var(--guide)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)) !important}
  .sync span{display:none}
}

main{max-width:1120px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.grid3,.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--guide);border-color:var(--guide);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:7px}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--mark);border-color:var(--mark);color:#1C2333}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.light{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;white-space:nowrap}
.light i{width:11px;height:11px;border-radius:50%;flex:none}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 27px,var(--guide-line) 27px 28px);opacity:.35;pointer-events:none}
.hero>*{position:relative;z-index:1}
.days{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:.9;color:var(--guide);font-variant-numeric:tabular-nums}
.days small{display:block;font-family:var(--f-body);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.plan-lines{display:grid;gap:3px;margin-top:8px}
.plan-lines div{display:flex;gap:8px}
.plan-lines b{min-width:68px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.25rem}
.kpi span{font-size:.75rem;color:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.days{font-size:2.8rem}}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .tv{font-size:1.45rem;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tl{font-size:.78rem;font-weight:600;margin-top:4px}
.tile .ts{font-size:.72rem;color:var(--muted);margin-top:2px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ocard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ocard:first-child{border-color:var(--guide);grid-column:span 2}
@media (max-width:620px){.ocard:first-child{grid-column:auto}}
.fam-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.fam-row:last-child{border-bottom:0}
.fam-row .nm{font-weight:600;overflow-wrap:anywhere}
.fam-row .tool{font-size:.8rem;color:var(--muted);margin-top:2px}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:10px}
.notice{padding:11px 14px;border-radius:10px;background:var(--guide-soft);font-size:.88rem;border:1px solid var(--guide-line)}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:transparent}

.form{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--guide)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:.88rem}
.daypick{display:flex;gap:5px;flex-wrap:wrap}
.daypick label{display:inline-flex}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.daypick input:checked+span{background:var(--guide);border-color:var(--guide);color:#fff}
.daypick input:focus-visible+span{outline:2px solid var(--guide);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--guide);color:#fff}

/* player */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pl-top{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.pl-top-in{max-width:820px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-title{font-family:var(--f-display);font-weight:700;font-size:1.02rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pl-body{max-width:820px;margin:0 auto;padding-block:18px calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);padding:3px 10px 3px 3px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.step b{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-mono);font-size:.68rem}
.step.on{color:var(--guide);border-color:var(--guide)}
.step.on b{background:var(--guide);color:#fff;border-color:var(--guide)}
.step.past{color:var(--ok)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:.95rem;padding:4px 10px;border-radius:8px;background:var(--guide-soft);color:var(--guide);white-space:nowrap}
.timer small{font-weight:500;color:var(--muted);margin-left:6px}
.timer.low{background:var(--bad-soft);color:var(--bad)}

/* lesson */
.lesson p{margin:0 0 .6em}
.lesson ul,.lesson ol{margin:.2em 0 .7em;padding-left:1.2em}
.lesson li{margin:.2em 0}
.lesson h4{margin:.6em 0 .3em;font-size:1rem}
.lesson code{font-family:var(--f-mono);font-size:.88em;background:var(--bg);padding:1px 5px;border-radius:5px}
.lesson strong{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--mark) 55%,transparent) 58%)}
.part-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.part-h .no{width:30px;height:30px;border-radius:50%;border:2px solid var(--guide);color:var(--guide);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;flex:none}
.box{border-radius:10px;padding:10px 13px;margin:10px 0;font-size:.92rem;border:1px solid transparent}
.box .bt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:3px}
.box.kural{background:var(--blue-soft)} .box.kural .bt{color:var(--blue)}
.box.tuzak{background:var(--bad-soft)} .box.tuzak .bt{color:var(--bad)}
.box.puf{background:var(--mark-soft)} .box.puf .bt{color:var(--warn)}
.box.senin{background:var(--guide-soft);border-color:var(--guide-line)} .box.senin .bt{color:var(--guide)}
.box.hatirla{background:var(--ok-soft)} .box.hatirla .bt{color:var(--ok)}
.box.terim{background:var(--bg);border-color:var(--line)} .box.terim .bt{color:var(--muted)}
.ltable{overflow-x:auto;margin:10px 0}
.ltable table{border-collapse:collapse;font-size:.88rem;min-width:100%}
.ltable th{background:var(--bg);text-align:left;padding:7px 9px;border:1px solid var(--line);font-size:.78rem}
.ltable td{padding:7px 9px;border:1px solid var(--line);vertical-align:top}
.ex{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}

/* question card */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.passage{font-size:.97rem;line-height:1.65;background:var(--bg);border-left:3px solid var(--guide);border-radius:4px 10px 10px 4px;padding:12px 14px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.qtext{font-size:1.02rem;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:14px}
.opts{display:grid;gap:7px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px 9px 9px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--guide-line);background:var(--guide-soft)}
.opt .bb{width:30px;height:30px;border-radius:50%;border:2px solid var(--guide);color:var(--guide);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.opt.picked .bb{background:var(--guide);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bb{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bb{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.tried{opacity:.55;text-decoration:line-through}
.opt:disabled{cursor:default}
.opts.hidden-opts{filter:blur(5px);pointer-events:none;user-select:none}
.labelbox{border:1.5px dashed var(--guide-line);border-radius:10px;padding:12px;margin-bottom:12px;display:grid;gap:8px}
.labelbox .lq{font-weight:600;font-size:.92rem}
.labbtns{display:flex;gap:6px;flex-wrap:wrap}
.labbtn{min-width:46px;height:38px;border-radius:999px;border:2px solid var(--guide);background:transparent;color:var(--guide);font-family:var(--f-mono);font-weight:700;padding:0 12px}
.labbtn.on{background:var(--guide);color:#fff}
.expl{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border-left:3px solid var(--guide);display:grid;gap:6px}
.hint{margin-top:12px;padding:10px 13px;border-radius:10px;background:var(--mark-soft);font-size:.92rem}
.rep{padding:8px 12px;border-radius:9px;background:var(--blue-soft);font-size:.88rem}
.diag{margin-top:12px;display:grid;gap:8px}
.diag .chips{display:flex;gap:6px;flex-wrap:wrap}
.diag .chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:.8rem}
.diag .chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qnav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}

/* exam sheet */
.sheet{background:var(--paper);border:1px solid var(--guide-line);border-radius:var(--r);padding:14px}
.sheet-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cell{position:relative;font-family:var(--f-mono);font-size:.72rem;padding:6px 0;text-align:center;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.cell.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cell.flg{border-color:var(--guide);border-style:dashed}
.cell.cur{outline:2px solid var(--guide);outline-offset:1px}
.cell.st::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.pend{opacity:.3}
.cell.right{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
@media (max-width:520px){.sheet-grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
.secchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.secchips button{flex:none;font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper);white-space:nowrap}

.score{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.score .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--guide)}
.score .mid{font-family:var(--f-mono);font-size:1.5rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--muted)}
.lvl-good i{background:var(--ok)} .lvl-mid i{background:var(--warn)} .lvl-low i{background:var(--bad)}
details.rev{border-bottom:1px solid var(--line);padding:9px 0}
details.rev summary{cursor:pointer;display:flex;gap:9px;align-items:center;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.skip{background:var(--line)}

.loading{display:flex;align-items:center;gap:12px;padding:26px;justify-content:center;color:var(--muted);text-align:center;flex-wrap:wrap}
.spin{display:flex;gap:5px}
.spin i{width:11px;height:11px;border-radius:50%;border:2px solid var(--guide);animation:fill 1.2s infinite}
.spin i:nth-child(2){animation-delay:.2s}.spin i:nth-child(3){animation-delay:.4s}.spin i:nth-child(4){animation-delay:.6s}

{f:"okuma",s:"okuma",g:1,p:"Urban beekeeping has grown rapidly in many European cities over the past decade, with hives appearing on rooftops, balconies and even office buildings. Supporters see it as a simple way to help pollinators, whose populations have declined sharply. However, a recent study in Zurich suggests that the trend may be causing problems. Researchers found that in areas with a high density of honeybee hives, wild bees had to compete for a limited supply of flowers, and their numbers fell. The authors do not argue that urban beekeeping should be banned. Instead, they recommend that cities plant more flowering species and limit the number of hives per square kilometre, so that honeybees and wild pollinators can coexist.",q:"According to the passage, supporters of urban beekeeping believe that ----.",o:["it is an easy way to help pollinators","it should be banned in city centres","wild bees no longer need flowers","it increases the number of office buildings","honeybees are a threat to wild bees"],a:0,l:"a simple way to help pollinators",h:"'Supporters' kelimesini parçada bul.",x:"Kanıt: 'Supporters see it as a simple way to help pollinators'.",d:["","Parçada yasak önerilmiyor.","Parçada yok.","Parçanın kelimesi ama anlam farklı.","Bu araştırmacıların bulgusu, destekçilerin görüşü değil."]},

{f:"okuma",s:"okuma",g:3,p:"Many people assume that multitasking allows them to get more done. Research, however, paints a different picture. When people switch between tasks, such as answering emails while writing a report, their brains need time to refocus each time they change activity. These small delays add up, and studies suggest that heavy multitaskers can lose up to 40 percent of their productive time. Multitasking also appears to increase errors. Interestingly, people who multitask the most often rate themselves as being good at it, although tests show that they perform worse than others at filtering out irrelevant information. Psychologists therefore recommend focusing on one task at a time and checking messages only at set intervals.",q:"The passage mainly discusses ----.",o:["how to write a report more quickly","why multitasking reduces efficiency despite common beliefs","the history of email","why psychologists prefer working at night","how the brain filters information while sleeping"],a:1,l:"Research, however, paints a different picture",h:"İlk iki cümle konuyu veriyor.",x:"Ana fikir: yaygın inanca rağmen çoklu görev verimi düşürüyor. Kanıt: 'Research, however, paints a different picture'.",d:["Detay bile değil.","","Parçada yok.","Parçada yok.","Parçada yok."]},

{f:"paragraf",s:"diyalog",q:"Lisa: I've been offered places at two universities, and I can't decide which one to choose.\nTom: ----\nLisa: The one in Edinburgh has a better reputation, but the other is much closer to home.",o:["Congratulations! What are the main differences between them?","I didn't apply to any universities this year.","You should have studied harder for the exams.","Which subject did your sister choose?","Edinburgh is a very expensive city to live in."],a:0,h:"Lisa'nın sonraki cevabı farkları anlatıyor.",x:"Lisa sonraki repliğinde iki üniversiteyi karşılaştırıyor; Tom farkları sormuş olmalı.",d:["","Konuyla bağ yok.","Teklif almış; anlamsız.","Konu dışı.","Lisa'nın cevabı buna yanıt değil."]},
{f:"paragraf",s:"diyalog",q:"Doctor: How long have you had this cough?\nPatient: ----\nDoctor: In that case, I'd like you to have a chest X-ray.",o:["I took some cough syrup this morning.","For about a month now, and it's getting worse.","My wife also has a cold.","I'll come back next week.","No, I don't smoke at all."],a:1,h:"Soru 'How long'.",x:"'How long' sorusu süre ister; röntgen kararı da uzun ve kötüleşen öksürüğe uygun.",d:["Süre yok.","","Konu dışı.","Soruya cevap değil.","Soruya cevap değil."]},
{f:"paragraf",s:"diyalog",q:"Interviewer: Why did you decide to leave your previous job?\nCandidate: ----\nInterviewer: I see. And what kind of challenges are you looking for?",o:["I'd prefer not to discuss my salary.","My previous manager was very kind.","I worked there for six years.","I wanted a role that would challenge me more.","I'm available to start next month."],a:3,h:"Mülakatçı sonra 'challenges' soruyor.",x:"Mülakatçının 'ne tür zorluklar' sorusu, adayın daha zorlayıcı bir rol istediğini söylediğini gösterir.",d:["Maaş sorulmadı.","Ayrılma nedeni değil.","Süre; neden değil.","","Neden değil."]},
{f:"paragraf",s:"diyalog",q:"Ahmet: The city plans to turn the old factory into a museum.\nSelin: ----\nAhmet: True, but the building has historical value, and a museum would attract tourists.",o:["I've never visited a museum in my life.","The factory closed because of financial problems.","Wouldn't it be better to build affordable housing there instead?","Tourists usually prefer beaches.","When will the factory start production again?"],a:2,h:"Ahmet 'True, but...' ile karşı bir öneriye cevap veriyor.",x:"'True, but' bir itirazı kabul edip karşılık verir: Selin müze yerine konut önermiş.",d:["Ahmet'in cevabı buna uymaz.","Bilgi; itiraz değil.","","'True, but the building has historical value' buna cevap olmaz.","Fabrika müze olacak; anlamsız."]},
{f:"paragraf",s:"diyalog",q:"Emma: I'm thinking of giving up my job to start my own business.\nJack: ----\nEmma: I know, but I've saved enough money to live on for at least a year.",o:["I started my own business last year.","Your boss must be very happy.","That's quite risky, isn't it? You'd lose your regular income.","Which company do you work for?","I'd love to have a regular job too."],a:2,h:"Emma 'I know, but...' diyerek bir endişeye cevap veriyor.",x:"Emma'nın 'biliyorum ama bir yıl yetecek param var' cevabı, Jack'in gelir kaybı riskini hatırlattığını gösterir.",d:["Emma'nın cevabı buna uymaz.","Anlamsız.","","Soru; cevap uymaz.","Cevap uymaz."]},

{f:"devrik",s:"restatement",q:"No sooner had the results been announced than the company's shares fell sharply.",o:["The results were announced because the shares had fallen.","The shares fell long before the results were announced.","The company's shares fell sharply immediately after the results were announced.","The results were not announced until the shares had fallen.","The shares rose slightly when the results were announced."],a:2,l:"the results had been announced",h:"No sooner ... than = as soon as.",x:"No sooner ... than = ... ar ... maz: sonuçlar açıklanır açıklanmaz hisseler düştü.",d:["Sebep ters.","Sıralama ters.","","Sıralama ters.","Anlam ters."]},
{f:"paragraf",s:"restatement",q:"It was such a difficult exam that only a few students managed to finish it on time.",o:["Few students took the exam because it was so difficult.","Although the exam was difficult, most students finished it on time.","The students found the exam easy, so they finished it early.","The exam was so difficult that few students were able to finish it in time.","Only a few students thought the exam was difficult."],a:3,h:"such a ... that = so ... that.",x:"such a difficult exam that = the exam was so difficult that; only a few managed = few were able to.",d:["Sınava girmeyle bitirme karıştırılmış.","Anlam ters.","Anlam ters.","","Anlam değişmiş."]},

{f:"paragraf",s:"paragraf",q:"Electric scooters have become a common sight in many cities. ----. However, their popularity has also raised safety concerns, as the number of accidents involving scooter riders has risen sharply.",o:["Therefore, many cities have banned them completely","Most accidents happen at night","They offer a cheap and convenient way to travel short distances","Bicycles were invented in the nineteenth century","Scooter batteries usually last two years"],a:2,h:"Sonraki cümle 'However' ile olumsuz bir şey söylüyor. Boşluk ne olmalı?",x:"Sonraki cümle 'However' ile olumsuzluğa geçiyor; boşluk olumlu bir şey söylemeli: ucuz ve kullanışlı.",d:["'However' ile bağlantı bozulur; tamamen yasaklandıysa popülerlik konuşulmaz.","Kazalar sonraki cümlede; burada erken.","","Konu dışı.","Konu dışı."]},
{f:"paragraf",s:"paragraf",q:"Many people believe that eating late at night causes weight gain. ----. What seems to matter more is the total number of calories a person consumes during the day and the type of food eaten.",o:["Late dinners are common in Mediterranean countries","As a result, people should never eat after 8 p.m.","Some foods contain more vitamins than others","However, research suggests that the timing of meals has little effect on its own","Exercise is also important for health"],a:3,h:"İnanç → ? → asıl önemli olan.",x:"Yer = görev: yaygın inanç → (karşı çıkış) → asıl önemli olan. Köprü: 'However, research suggests...'.",d:["Konu kayıyor.","Sonraki cümleyle çelişir.","Konu dışı.","","Konu dışı."]},
{f:"paragraf",s:"paragraf",q:"----. For example, octopuses can open jars, and some crows use sticks as tools to reach food. Such findings have led scientists to rethink the way they measure intelligence in animals.",o:["Octopuses live in the ocean","Many animals are capable of surprisingly complex problem-solving","Scientists have stopped studying animal intelligence","Crows are found on every continent except Antarctica","Intelligence tests for humans are often criticised"],a:1,h:"'For example' ile başlayan cümle neyin örneği?",x:"Örnekler (ahtapot, karga) genel bir iddiayı destekliyor: birçok hayvan karmaşık problem çözebiliyor.",d:["Örnekler bunu açıklamaz.","","Sonraki cümleyle çelişir.","Konu dışı detay.","İnsan testleri konu dışı."]},
{f:"paragraf",s:"paragraf",q:"Many cities are replacing traditional streetlights with LED lamps. ----. In addition, LED lamps last much longer, which reduces maintenance costs.",o:["However, LED lamps are more expensive to repair","These lamps use significantly less energy than older models","Streetlights were first used in the seventeenth century","As a result, cities have become darker at night","Many residents prefer candles"],a:1,h:"'In addition' bir avantaj daha ekliyor.",x:"'In addition' önceki cümlenin de bir avantaj olduğunu gösterir: daha az enerji kullanıyorlar.",d:["Dezavantaj; 'In addition' ile uyumsuz.","","Konu dışı.","Olumsuz ve kanıtsız.","Konu dışı."]},

{f:"paragraf",s:"bozan",q:"(I) The printing press was invented in the fifteenth century. (II) Today, many people prefer reading e-books on their tablets. (III) It made books much cheaper and more widely available. (IV) As a result, literacy rates gradually increased across Europe. (V) Historians also believe that printing helped spread new scientific ideas.",o:["I","II","III","IV","V"],a:1,h:"III. cümledeki 'It' neyi gösteriyor?",x:"III'teki 'It' matbaayı gösterir; II araya girip bağı koparıyor ve günümüze atlıyor.",d:["Konuyu açıyor.","","Matbaanın etkisi.","III'ün sonucu.","Matbaanın bir etkisi daha."]},
{f:"paragraf",s:"bozan",q:"(I) Learning a musical instrument has many benefits for children. (II) It improves their concentration and memory. (III) Playing in a group also teaches them to cooperate with others. (IV) Moreover, studies suggest that musical training can improve children's performance in mathematics. (V) The piano was invented in Italy in the early eighteenth century.",o:["I","II","III","IV","V"],a:4,h:"Paragraf çocuklara faydaları sayıyor.",x:"I-IV çocuklara faydaları sıralıyor; V piyanonun tarihine geçiyor.",d:["Konuyu açıyor.","Fayda.","Fayda.","Fayda.",""]},
{f:"paragraf",s:"bozan",q:"(I) Many museums now offer virtual tours online. (II) These tours allow people to explore collections from anywhere in the world. (III) The Louvre in Paris is the most visited museum in the world. (IV) Virtual tours have proved especially useful for students and people with disabilities. (V) Some museums have even reported an increase in physical visitors after launching them.",o:["I","II","III","IV","V"],a:2,h:"Odak sanal turlar.",x:"Odak sanal turlar. III. cümle Louvre'un ziyaretçi sayısına geçiyor; V'teki 'them' sanal turları gösteriyor.",d:["Konuyu açıyor.","Sanal turun faydası.","","Sanal turun faydası.","Sanal turların etkisi."]},
{f:"paragraf",s:"bozan",q:"(I) Bamboo is one of the fastest-growing plants in the world. (II) Some species can grow almost a metre in a single day. (III) Giant pandas spend up to fourteen hours a day eating. (IV) Because of its strength, bamboo is widely used as a building material in Asia. (V) It is also used to make furniture, paper and even clothing.",o:["I","II","III","IV","V"],a:2,h:"Paragrafın odağı bambunun özellikleri ve kullanımı.",x:"Odak bambunun büyümesi ve kullanım alanları; III pandaların yeme alışkanlığına geçiyor.",d:["Konuyu açıyor.","Büyüme hızı.","","Kullanım.","Kullanım."]}

t6:{mantik:"Olumsuz ya da kısıtlayıcı bir ifade cümle başına geçince cümle **soru sırasına** girer.\n- **1.** Tetikleyiciyi sil.\n- **2.** Normal cümleyi yaz (özne + yardımcı fiil + fiil).\n- **3.** Soru yap.\n- **4.** Yardımcı fiili öne al.",

 parts:[{baslik:"Tetikleyiciler ve yardımcı fiil",anlatim:"**A grubu:** devriklik tetikleyicinin hemen arkasından gelir.\nNo sooner … than · Hardly / Scarcely … when · Not only · Never (before) · Rarely / Seldom · Little · Under no circumstances / On no account · nor / neither / so\n**B grubu:** devriklik ana cümlede gelir, X'in içi düz kalır.\nOnly after / when / if / by + X · Not until + X",

  kutular:[{tur:"tuzak",metin:"Devrik olmayanlar: It was not until … that · Only + özne (Only John knew) · Hardly anyone · cümle ortasındaki never."}],

 parts:[{baslik:"Dört kontrol: zamir, yön, odak, köprü",anlatim:"- **Zamir:** sonraki cümledeki 'this / they' neyi gösteriyor? O isim boşlukta olmalı.\n- **Yön:** 'However' sonrası ters yön → boşluk ters yönde.\n- **Odak:** paragrafın konusu dışına çıkan şık elenir.\n- **Köprü:** 'In addition' → boşluk da aynı türden bir bilgi.",
  sence:{soru:"Boşluktan sonraki cümle 'However, their popularity has also raised concerns' ise boşluk nasıl bir cümle olmalı?",cevap:"Olumlu bir şey söylemeli; çünkü However yönü olumsuza çeviriyor."},
  tablo:null,kutular:[{tur:"tuzak",metin:"Konuyla ilgili ama paragrafın odağından çıkan cümle en güçlü çeldiricidir."}],
  ornekler:[{q:"Electric scooters have become a common sight in many cities. ----. However, their popularity has also raised safety concerns.",o:["Therefore, many cities have banned them","They offer a cheap and convenient way to travel short distances","Most accidents happen at night","Bicycles were invented in the nineteenth century","Scooter batteries usually last two years"],a:1,neden:"Sonraki cümle 'However' ile olumsuza dönüyor → boşluk olumlu: ucuz ve kullanışlı.",celdiriciler:["Yön bozulur.","","Erken; kaza konusu sonra geliyor.","Odak dışı.","Odak dışı."]},
   {q:"----. For example, octopuses can open jars, and some crows use sticks as tools. Such findings have led scientists to rethink animal intelligence.",o:["Octopuses live in the ocean","Many animals are capable of surprisingly complex problem-solving","Scientists have stopped studying animals","Crows live on every continent","Human intelligence tests are criticised"],a:1,neden:"'For example' sonrası örnekler genel bir iddiayı destekler → boşluk o iddia.",celdiriciler:["Örneklerin konusu değil.","","Son cümleyle çelişir.","Odak dışı detay.","Odak dışı."]}],
  ornek_soru:{q:"Many cities are replacing streetlights with LED lamps. ----. In addition, LED lamps last much longer.",o:["These lamps use much less energy","LED lamps are expensive to repair","Streetlights were first used in 1600s","Cities are darker now","Residents prefer candles"],a:0,cevap:"'In addition' bir avantaj daha ekliyor → boşluk da avantaj."}}],
 tuzaklar:["Konuyla ilgili ama odak dışı cümleyi seçmek.","Sonraki cümlenin zamirini kontrol etmemek.","Bağlayıcının yönünü atlamak."],
 hatirlanacaklar:["Yer = görev.","Zamir: sonraki 'this / they' boşluktaki ismi gösterir.","However → yön değişir.","In addition / For example → aynı yön / örnek.","Odak dışı cümle elenir."]},
t18:{mantik:"Anlam bütünlüğünü bozan cümlede:\n- **1.** I. cümlenin odağını bul.\n- **2.** Her cümleyi odağa göre kontrol et.\n- **3.** Şüpheli cümleyi çıkar; kalanlar akıyor mu? (çıkar-birleştir testi)",
 kontrol:["I. cümlenin odağı ne?","Hangi cümle konuyu başka bir şeye kaydırıyor?","Zamirler (it, they, this) bağlantıyı koruyor mu?","Çıkar-birleştir testi."],
 parts:[{baslik:"Odak ve çıkar-birleştir testi",anlatim:"Bozan cümle çoğu zaman aynı genel konudadır ama odağı kaydırır: yürüyüşün faydalarından şehir otobüslerine geçmek gibi.\nŞüpheli cümleyi çıkarınca önceki ve sonraki cümle sorunsuz birleşiyorsa cevap odur.",
  sence:{soru:"Bir cümle konuyla ilgili bir kelime içeriyorsa (ör. 'pandas' ve 'bamboo') yine de bozan cümle olabilir mi?",cevap:"Evet. Kelime ortak olabilir ama odak (bambunun büyümesi ve kullanımı) değişiyorsa cümle bozar."},
  tablo:{cols:["Tuzak","Nasıl tanınır?"],rows:[["Aynı kelime, farklı odak","Anahtar kelime var ama cümle başka bir şeyi anlatıyor."],["Zamir zinciri kopuyor","Sonraki cümlenin 'it / they'ı artık doğru ismi göstermiyor."],["Zaman / bakış atlaması","Tarihsel paragrafta birden günümüze geçiş."],["Genel doğru cümle","Doğru bir bilgi ama paragrafın amacına hizmet etmiyor."]]},
  kutular:[{tur:"puf",metin:"İlk cümle neredeyse hiç cevap değildir; konuyu o açar."}],
  ornekler:[{q:"(I) Walking is one of the simplest forms of exercise. (II) It requires no special equipment. (III) Regular walking reduces the risk of heart disease. (IV) Many cities are investing in electric buses. (V) It can also improve mood and sleep.",o:["I","II","III","IV","V"],a:3,neden:"Odak yürüyüş; IV şehir otobüslerine geçiyor. Çıkarınca V'teki 'It' yine yürüyüşü gösteriyor.",celdiriciler:["Konuyu açıyor.","Fayda.","Fayda.","","Fayda."]},
   {q:"(I) The printing press was invented in the fifteenth century. (II) Today, many people prefer e-books. (III) It made books much cheaper. (IV) As a result, literacy increased. (V) It also helped spread scientific ideas.",o:["I","II","III","IV","V"],a:1,neden:"III'teki 'It' matbaayı gösterir; II araya girip bağı koparıyor ve günümüze atlıyor.",celdiriciler:["Konuyu açıyor.","","Matbaanın etkisi.","III'ün sonucu.","Bir etki daha."]}],
  ornek_soru:{q:"(I) Music has many benefits for children. (II) It improves concentration. (III) Group playing teaches cooperation. (IV) It may improve maths performance. (V) The piano was invented in Italy.",o:["I","II","III","IV","V"],a:4,cevap:"V, çocuklara faydalardan piyanonun tarihine geçiyor."}}],
 tuzaklar:["Ortak kelimeye bakıp odak değişimini atlamak.","İlk cümleyi işaretlemek.","Zamir zincirini kontrol etmemek."],
 hatirlanacaklar:["I. cümle odağı verir.","Bozan cümle konuyu değil odağı kaydırır.","Çıkar-birleştir testi uygula.","Zamir zinciri kopuyorsa şüphelen.","Doğru bilgi ≠ paragrafa uygun bilgi."]},
t19:{mantik:"Anlamca en yakın cümle (restatement) sorusunda **anlamın üç parçası** korunmalı:\n- **1. Ana ilişki:** sebep, zıtlık, koşul, sıralama\n- **2. Kesinlik:** probably, may, must, unlikely\n- **3. Olumlu / olumsuz:** not, few, hardly",
 kontrol:["Ana ilişkiyi Türkçe tek cümleyle yaz.","Kesinlik kelimesi korunmuş mu?","Olumsuzluk korunmuş mu?","Fazladan bilgi ekleyen şıkkı ele."],
 parts:[{baslik:"Eş anlamlı yapılar",anlatim:"Restatement'ta aynı anlam farklı yapıyla yazılır. Sık çıkan eşleşmeler:",
  sence:{soru:"'It is unlikely to succeed unless...' cümlesinde 'unlikely' kaybolursa ne olur?",cevap:"Kesinlik değişir; 'muhtemelen' yerine 'kesinlikle' anlamı çıkar, şık yanlış olur."},
  tablo:{cols:["Yapı","Eşi"],rows:[["No sooner … than / Hardly … when","as soon as, immediately after"],["unless","if … not / without"],["such a … that / so … that","so … that / too … to"],["would not have … without","… made it possible"],["despite / although","even though / nevertheless"],["It was not until X that","only in / at X"]]},
  kutular:[{tur:"tuzak",metin:"few (az, olumsuz) ile a few (birkaç, olumlu) anlamı değiştirir."}],
  ornekler:[{q:"No sooner had the results been announced than the company's shares fell sharply.",o:["The results were announced because the shares had fallen.","The shares fell long before the results were announced.","The company's shares fell sharply immediately after the results were announced.","The results were not announced until the shares had fallen.","The shares rose when the results were announced."],a:2,neden:"No sooner … than = immediately after; sıralama ve 'sharply' korunmuş.",celdiriciler:["Sebep ters.","Sıralama ters.","","Sıralama ters.","Anlam ters."]},
   {q:"The new policy is unlikely to succeed unless it is supported by local businesses.",o:["Without the support of local businesses, the new policy will probably fail.","The policy has succeeded thanks to local businesses.","Local businesses are unlikely to support the policy.","If the policy succeeds, local businesses will support it.","The policy will succeed even without local support."],a:0,neden:"unless = without; unlikely to succeed = will probably fail.",celdiriciler:["","Zaman ve anlam değişmiş.","Olasılık başka özneye kaymış.","Koşul ters.","Anlam ters."]}],
  ornek_soru:{q:"It was such a difficult exam that only a few students finished it on time.",o:["The exam was so difficult that few students were able to finish it in time.","Most students finished the exam on time.","Few students took the exam.","The exam was easy.","Only a few students found it difficult."],a:0,cevap:"such a … that = so … that; only a few = few were able to."}}],
 tuzaklar:["Kesinlik kelimesini (probably, may) gözden kaçırmak.","few / a few farkını atlamak.","Doğru ama fazladan bilgi ekleyen şıkkı seçmek."],
 hatirlanacaklar:["Ana ilişki + kesinlik + olumsuzluk korunmalı.","unless = without / if not.","No sooner … than = immediately after.","such a … that = so … that.","Fazla bilgi ekleyen şık elenir."]},
t20:{mantik:"Diyalog tamamlamada boşluğu **sonraki repliğe** göre çöz:\n- **1.** Boşluktan sonraki cevap neye cevap veriyor?\n- **2.** 'True, but…', 'I know, but…', 'In that case…' gibi başlangıçlar boşluğun türünü ele verir.",
 kontrol:["Önce sonraki repliği oku.","Sonraki replik soru mu cevaplıyor, itiraz mı karşılıyor?","Soru kelimesi (How long, Why) cevapta karşılanmış mı?","Konuşmanın tonu (resmî / samimi) uyuyor mu?"],
 parts:[{baslik:"Sonraki replik anahtarı",anlatim:"Boşluk, hem önceki hem sonraki repliğe uymalı. Çoğu zaman sonraki replik daha çok ipucu verir.",
  sence:{soru:"Sonraki replik 'True, but the building has historical value' ise boşlukta ne olmalı?",cevap:"Bir itiraz ya da alternatif öneri; 'True, but' önce kabul edip sonra karşı çıkar."},
  tablo:{cols:["Sonraki replik","Boşluk"],rows:[["True, but … / I know, but …","itiraz, uyarı, endişe"],["In that case …","durumu belirleyen bir bilgi"],["I see. And …","önceki soruya verilmiş bir cevap"],["Exactly. / I agree.","bir görüş"],["Don't worry, …","bir endişe"]]},
  kutular:[{tur:"tuzak",metin:"Konuyla ilgili ama sonraki repliğe cevap olmayan şık en güçlü çeldiricidir."}],
  ornekler:[{q:"Doctor: How long have you had this cough?\nPatient: ----\nDoctor: In that case, I'd like you to have a chest X-ray.",o:["I took some syrup this morning.","For about a month now, and it's getting worse.","My wife has a cold too.","I'll come back next week.","No, I don't smoke."],a:1,neden:"How long → süre; 'In that case X-ray' kötüleşen, uzun süren öksürüğe uyar.",celdiriciler:["Süre yok.","","Konu dışı.","Soruya cevap değil.","Soruya cevap değil."]},
   {q:"Emma: I'm thinking of giving up my job to start my own business.\nJack: ----\nEmma: I know, but I've saved enough money to live on for a year.",o:["I started a business last year.","Your boss must be happy.","That's quite risky, isn't it? You'd lose your regular income.","Which company do you work for?","I'd love a regular job too."],a:2,neden:"'I know, but… param var' → Jack gelir kaybı riskini hatırlatmış.",celdiriciler:["Cevap uymaz.","Anlamsız.","","Soru; cevap uymaz.","Cevap uymaz."]}],
  ornek_soru:{q:"A: Why did you leave your previous job?\nB: ----\nA: I see. And what kind of challenges are you looking for?",o:["I wanted a role that would challenge me more.","I worked there for six years.","My manager was kind.","I'd prefer not to discuss salary.","I can start next month."],a:0,cevap:"A'nın 'ne tür zorluklar' sorusu, B'nin daha zorlayıcı bir rol istediğini söylediğini gösterir."}}],
 tuzaklar:["Sadece önceki repliğe bakmak.","Konuyla ilgili ama cevap olmayan şıkkı seçmek.","'True, but' sinyalini kaçırmak."],
 hatirlanacaklar:["Önce sonraki repliği oku.","True, but / I know, but → itiraz ya da endişe.","In that case → belirleyici bilgi.","Soru kelimesi cevapta karşılanmalı.","Konuyla ilgili ≠ cevap."]},
t21:{mantik:"Çeviri sorularında anlamı **parça parça eşle**:\n- **1. Zaman** (geçmiş / şimdi / gelecek)\n- **2. Çatı** (etken / edilgen)\n- **3. Ana ilişki** (bağlaç: zıtlık, sebep, koşul)\n- **4. Kesinlik ve olumsuzluk** (may, only, still, not yet)",
 kontrol:["Ana ilişkiyi bul (although, because, unless...).","Zaman ve çatı korunmuş mu?","still, only, yet, may gibi küçük kelimeler karşılanmış mı?","Fazladan anlam ekleyen şıkkı ele."],
 parts:[{baslik:"EN → TR",anlatim:"İngilizce cümlenin iskeletini çıkar: bağlaç → ana cümle → küçük kelimeler. Türkçe şıkta bunların hepsi karşılanmalı.",
  sence:{soru:"'Although X has increased, they still account for a small share' cümlesinde 'still' kaybolursa ne olur?",cevap:"'hâlâ' anlamı gider; şık eksik çeviri olur ve elenir."},
  tablo:{cols:["İngilizce","Türkçe karşılık"],rows:[["although / even though","-se de, -mesine rağmen"],["The more …, the more …","ne kadar çok …, o kadar çok …"],["It was not until X that","ancak X'te"],["account for","oluşturmak / açıklamak"],["be likely / unlikely to","muhtemelen … / muhtemelen … değil"]]},
  kutular:[{tur:"tuzak",metin:"Doğru gibi görünen şık çoğu zaman tek bir küçük kelimeyi (only, still, yet) atlar ya da ekler."}],
  ornekler:[{q:"It was not until the late nineteenth century that scientists began to understand how diseases spread.",o:["Bilim insanları on dokuzuncu yüzyılın sonlarına kadar hastalıkların nasıl yayıldığını anlamıştı.","Bilim insanları hastalıkların nasıl yayıldığını ancak on dokuzuncu yüzyılın sonlarında anlamaya başladı.","On dokuzuncu yüzyıl sonlarında hastalıkların yayılması durduruldu.","Hastalıkların nasıl yayıldığı o zamandan beri bilinmektedir.","Bilim insanları o dönemde hastalıkları tam olarak anlamıştı."],a:1,neden:"It was not until X that → ancak X'te; began to understand → anlamaya başladı.",celdiriciler:["Anlam ters.","","Fazladan anlam.","Yapı değişmiş.","'began to' kaybolmuş, 'tam olarak' eklenmiş."]},
   {q:"The more people rely on online shopping, the fewer small shops are able to survive.",o:["İnsanlar internet alışverişine güvendiği için küçük dükkânlar kapanıyor.","İnsanlar internet alışverişine ne kadar çok bağımlı olursa, küçük dükkânların o kadar azı ayakta kalabiliyor.","Küçük dükkânlar internetle rekabet edemiyor.","İnternetten alışveriş yapanlar küçük dükkânları tercih etmiyor.","Küçük dükkânların ayakta kalması için alışveriş azalmalı."],a:1,neden:"The more …, the fewer … → ne kadar çok …, o kadar azı …",celdiriciler:["Orantı kaybolmuş.","","Farklı anlam.","Farklı anlam.","Öneri eklenmiş."]}],
  ornek_soru:{q:"Although the number of electric cars has increased rapidly, they still account for only a small share of the market.",o:["Elektrikli araçların sayısı hızla artmış olsa da hâlâ pazarın yalnızca küçük bir payını oluşturuyorlar.","Sayıları arttığı için pazarın büyük kısmını oluşturuyorlar.","Payları küçük olduğu için sayıları artıyor.","Sayıları yavaş artıyor.","Payları değişmeyecek."],a:0,cevap:"Although (-se de), still (hâlâ), only (yalnızca) hepsi karşılanmış."}},
 {baslik:"TR → EN",anlatim:"Türkçe cümlede de aynı iskeleti çıkar: '-e rağmen' (despite), '-diği için' (because), 'olabilir' (may), 'henüz' (not yet). İngilizce şıkta bunların hepsi olmalı; fazladan iddia olmamalı.",
  sence:{soru:"'… değiştirmeme kararı aldı' cümlesini 'decided to not change' yerine nasıl yazarsın?",cevap:"decided not to change: olumsuzluk to'dan önce gelir."},
  tablo:null,kutular:[{tur:"puf",metin:"Önce Türkçe cümlenin yüklemini bul, sonra İngilizce şıklarda aynı fiil + zaman + olumsuzluk var mı, ona bak."}],
  ornekler:[{q:"Hükümet, enerji fiyatlarındaki artışa rağmen elektrik tarifelerini değiştirmeme kararı aldı.",o:["Because of the rise in energy prices, the government decided to change tariffs.","The government has not yet decided whether to change tariffs.","Despite the decision, tariffs rose.","The government decided not to change electricity tariffs despite the rise in energy prices.","The government changed tariffs to prevent a rise in prices."],a:3,neden:"-e rağmen = despite; değiştirmeme kararı aldı = decided not to change.",celdiriciler:["Sebep ve anlam ters.","Karar alınmamış.","Özne değişmiş.","","Amaç eklenmiş."]},
   {q:"Uzmanlar, yeni yasanın kirliliği azaltmada beklenenden daha az etkili olabileceği konusunda uyarıyor.",o:["Experts claim that the new law has reduced pollution more than expected.","Experts warn that the new law may be less effective in reducing pollution than expected.","Pollution will not be reduced unless a new law is introduced.","Experts warn that pollution may increase despite the law.","The new law is the most effective way to reduce pollution."],a:1,neden:"warn (uyarıyor), may (olabilir), less effective than expected hepsi karşılanmış.",celdiriciler:["Anlam ters.","","Koşul eklenmiş.","Farklı anlam.","Anlam ters."]}],
  ornek_soru:{q:"Bu ilacın yan etkileri henüz tam olarak bilinmemektedir.",o:["The side effects of this drug are not yet fully known.","The side effects are well known.","The drug has no side effects.","The drug has not been tested.","The side effects were known before."],a:0,cevap:"henüz = not yet, tam olarak = fully, bilinmemektedir = are not known."}}],
 tuzaklar:["Küçük kelimeleri (still, only, yet, may) atlamak.","Doğru ama fazladan iddia ekleyen şıkkı seçmek.","Edilgeni etken çevirmek."],
 hatirlanacaklar:["Zaman + çatı + ana ilişki + küçük kelimeler.","although = -se de · despite = -e rağmen.","The more … the more … = ne kadar … o kadar.","It was not until X that = ancak X'te.","Fazla anlam ekleyen şık elenir."]}

 ornekler:[{q:"----. Some species can travel thousands of kilometres using the Earth's magnetic field, while others navigate by the position of the sun or the stars. Scientists are still trying to understand exactly how these mechanisms work.",o:["Migrating birds use a variety of remarkable methods to find their way","Many birds migrate south in winter","The Earth's magnetic field protects the planet from solar radiation","Stars are easier to see in rural areas","Some scientists prefer studying insects"],a:0,neden:"Sonraki cümleler farklı yön bulma yöntemlerini sıralıyor → hepsini kapsayan konu cümlesi.",celdiriciler:["","Göçü söylüyor ama yön bulmayı kapsamıyor; dar.","Odak dışı.","Odak dışı.","Odak dışı."]},

const qhash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "b"+(h>>>0).toString(36)};
const BANK_ALL=(()=>{const all=[...(typeof BANK1!=="undefined"?BANK1:[]),...(typeof BANK2!=="undefined"?BANK2:[])];const gp={};all.forEach(x=>{if(x.g&&x.p)gp[x.g]=x.p});
  return all.map(x=>({bid:qhash((x.g?"g"+x.g:"")+x.q),fam:x.f,sec:x.s,g:x.g||null,p:x.p||(x.g?gp[x.g]:"")||"",q:x.q,o:x.o,a:x.a,lab:x.l||"",hint:x.h||"",x:x.x||"",d:x.d||[],tip:x.t||""}))})();
function prepBank(x){const fixed=x.sec==="bozan"||!!x.g;const idx=fixed?[0,1,2,3,4]:shuffle([0,1,2,3,4]);return Object.assign({},x,{id:uid(),o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a),d:idx.map(i=>x.d[i]||""),rep:false})}
function pickBank(pred,n,used){if(n<=0)return [];const old=addDays(today(),-3);const sc=x=>{const s=S.seen&&S.seen[x.bid];return s?(s>=old?2:1):0};
  const out=shuffle(BANK_ALL.filter(x=>pred(x)&&!used.has(x.bid))).sort((a,b)=>sc(a)-sc(b)).slice(0,n);out.forEach(x=>used.add(x.bid));return out}
function buildBankSet({n,warm,topic,repFams,tanima}){const used=new Set();const out=[];const reps=new Set();
  (repFams||[]).forEach(f=>{const r=pickBank(x=>x.fam===f&&!x.g,1,used)[0];if(r){out.push(r);reps.add(r.bid)}});
  const weakOrder=Object.entries(S.fams).filter(([k])=>FAMILIES[k]).sort((a,b)=>LIGHT_ORDER[a[1].light]-LIGHT_ORDER[b[1].light]||b[1].wrong-a[1].wrong).map(([k])=>k);
  if(warm)out.push(...pickBank(x=>x.fam==="eh"&&x.sec==="gramer",n-out.length,used));
  else if(tanima){unknownFams().forEach(f=>{if(out.length<n)out.push(...pickBank(x=>x.fam===f&&!x.g,1,used))})}
  else{const tf=topic&&topic.f&&topic.f.length?topic.f:weakOrder.slice(0,4);
    out.push(...pickBank(x=>tf.includes(x.fam)&&!x.g,Math.max(0,n-5-out.length),used));
    out.push(...pickBank(x=>x.fam==="edat"&&!x.g,3,used));out.push(...pickBank(x=>x.fam==="turetme"&&!x.g,2,used))}
  for(const f of weakOrder){if(out.length>=n)break;out.push(...pickBank(x=>x.fam===f&&!x.g,1,used))}
  if(out.length<n)out.push(...pickBank(x=>!x.g,n-out.length,used));
  if(out.length<n-1)return null;
  return shuffle(out.slice(0,n)).map(x=>{const q=prepBank(x);q.rep=reps.has(x.bid);return q})}
function bankSection(s,n,used){if(s==="okuma"||s==="cloze"){const per=s==="okuma"?4:5;if(n%per)return null;const groups={};BANK_ALL.filter(x=>x.sec===s&&x.g).forEach(x=>(groups[x.g]=groups[x.g]||[]).push(x));
    const gs=shuffle(Object.values(groups).filter(g=>g.length===per&&!g.some(x=>used.has(x.bid))));if(gs.length<n/per)return null;const out=gs.slice(0,n/per).flat();out.forEach(x=>used.add(x.bid));return out.map(prepBank)}
  const pool=pickBank(x=>x.sec===s&&!x.g,n,used);return pool.length===n?pool.map(prepBank):null}

  for(const k of ["attempts","mistakes","vocab","sessions","decisions","mocks","skips","todos"]) if(!Array.isArray(s[k])) s[k]=[];

function prepQs(arr){if(!Array.isArray(arr))return[];let lastP={};
  return arr.filter(q=>q&&typeof q.q==="string"&&Array.isArray(q.o)&&q.o.length===5&&Number.isInteger(+q.a)&&+q.a>=0&&+q.a<5).map(q=>{
    const g=q.g??null;if(q.p)lastP[g]=String(q.p);const p=q.p?String(q.p):(g!==null&&lastP[g]?lastP[g]:"");
    const fixed=q.sec==="bozan"||q.o.every(o=>/^(I|II|III|IV|V)$/.test(String(o).trim()));
    const idx=fixed?[0,1,2,3,4]:shuffle([0,1,2,3,4]);const d=Array.isArray(q.d)?q.d:[];
    return {id:uid(),fam:FAMILIES[q.fam]?q.fam:"kelime",sec:SECTIONS[q.sec]?q.sec:"gramer",g,p,q:String(q.q),o:idx.map(i=>String(q.o[i])),a:idx.indexOf(+q.a),lab:String(q.lab||""),hint:String(q.hint||""),x:String(q.x||""),d:idx.map(i=>String(d[i]||"")),tip:String(q.tip||""),rep:!!q.rep}})}

    :`- aile ${f} (${FAMILIES[f].n}): ${F.note?"not: "+F.note:"bu ailenin tipik tuzağı"}`}).join("\n")}

  const prompt=`Sen 2026-YDS'ye (ÖSYM, İngilizce) hazırlanan bir öğrencinin koçusun. ÖSYM'nin çıkmış sorularını kopyalama; bütün sorular özgün ve gerçek YDS üslubunda, akademik İngilizceyle yazılsın. Soru kökleri ve şıklar İngilizce (çeviri sorularında bir taraf Türkçe), açıklamalar Türkçe ve sade olsun.
${body}${reps}
Her soruda 5 şık ve tek doğru cevap olsun. Doğru cevapları A-E arasında dengeli dağıt. Açıklamada şık harfi kullanma, şıkkın kendisine atıf yap.

async function verifyQs(qs,signal){if(!qs.length)return {qs,dropped:0};
  try{const sample=await getSample();
    const txt=qs.map((q,i)=>`#${i}\n${q.p?"Parça: "+q.p+"\n":""}${q.q}\n${q.o.map((o,j)=>LETTERS[j]+") "+o).join("\n")}`).join("\n\n");
    const out=await sample.json(`Aşağıdaki YDS sorularını sen çöz; cevap anahtarı sende yok. Her soru için tek doğru şıkkı seç. Birden fazla şık savunulabiliyorsa ya da hiçbiri doğru değilse "belirsiz": true yaz.
Yalnızca JSON dizisi döndür: [{"i":0,"a":"C","belirsiz":false}]

${txt}`,{cache:false,signal});
    const m={};(Array.isArray(out)?out:[]).forEach(r=>{if(r&&r.i!==undefined)m[+r.i]=r});
    const keep=qs.filter((q,i)=>{const r=m[i];if(!r)return true;const a=LETTERS.indexOf(String(r.a||"").trim().toUpperCase().charAt(0));return a===q.a&&!r.belirsiz});
    return keep.length>=Math.ceil(qs.length*.6)?{qs:keep,dropped:qs.length-keep.length}:{qs,dropped:0}}
  catch(e){if(e&&e.code==="cancelled")throw e;return {qs,dropped:0}}}
async function genLesson(topic,signal){
  const sample=await getSample();const fams=topic.f||[];
  const myErr=S.mistakes.filter(m=>fams.includes(m.fam)).slice(-5).map(m=>`"${m.q.slice(0,160)}" → seçtiği "${m.o[m.ua]??"boş"}", doğrusu "${m.o[m.a]}"${m.diag?` (kendi teşhisi: ${m.diag})`:""}`).join("\n");
  const prompt=`YDS'ye hazırlanan bir öğrenciye "${topic.t}" konusunu anlat. Öğrenci kâğıda not alıyor, anlatım not almaya uygun olsun. Türkçe, sıcak ama net yaz; örnek cümleler İngilizce.
Düzen her zaman şu sırada: adım kutusu (her soruda uygulanacak kontrol sırası, ör. 1. YAPI → 2. ANLAM → 3. ZAMAN) → ana tablo (satır = anlam, sütun = yapı) → destek tabloları → kontrol listesi → çözümlü örnekler → örnek sorular → 5 satırlık hatırlanacaklar. Dil kısa, madde madde ve Türkçe; İngilizce yalnızca örneklerde.
Kurallar:
- Önce kuralın mantığını sade Türkçeyle anlat, sonra YDS'de nasıl sorulduğunu göster.
- Çözümlü örneklerde "neden" önce yapıyı, sonra anlamı açıklasın; her çeldirici için tek cümle yaz (ör. "Due to yapıca doğru, anlamca ters").
- Her partta öğrenciye kısa bir "sence neden?" sorusu sor (ör. "I wish I have more time neden yanlış?") ve beklenen cevabı tek cümleyle ver.
- Tabloda sütun = yapı (ör. bağlaç | edat | geçiş zarfı), satır = anlam; satırlar yan yana okunabilsin.
- Yeni bir terim (çapa, normal cümle, kanıt gibi) ilk kullanımda örnek bir satırla tanımlansın.
- Toplam 4-6 çözümlü örnek: İngilizce cümle, doğru cevap, neden doğru olduğu ve HER çeldiricinin neden yanlış olduğu.
- Her partın sonunda testten önce gösterilecek 1 örnek soru (çözümüyle).
- Kontrol araçları: ${fams.map(f=>FAMILIES[f]?FAMILIES[f].tool:"").filter(Boolean).join(" | ")||"yok"}.
${myErr?`Öğrencinin bu konudaki kendi hataları (tuzaklar listesine bunları da kat):\n${myErr}`:""}
Yalnızca şu yapıda JSON döndür:
{"mantik":"adım kutusu: kuralın mantığı ve her soruda uygulanacak sıra (md: '- ' madde, **kalın**)","terimler":[{"terim":"","tanim":"","ornek":""}],"kontrol":["kontrol listesi maddeleri"],
"parts":[{"baslik":"","anlatim":"3-8 satır md","sence":{"soru":"kısa 'sence neden?' sorusu","cevap":"beklenen cevap, tek cümle"},"tablo":{"cols":["Anlam","..."],"rows":[["",""]]},"kutular":[{"tur":"kural|tuzak|puf","metin":""}],"ornekler":[{"q":"","o":["","","","",""],"a":0,"neden":"","celdiriciler":["","","","",""]}],"ornek_soru":{"q":"","o":["","","","",""],"a":0,"cevap":"Çünkü ..."}}],
"tuzaklar":["sınavda en çok kaçan şeyler"],"hatirlanacaklar":["5 satır"]}
"parts" 2-4 öğe olsun; tablosu olmayan partta "tablo": null yaz. "hatirlanacaklar" tam 5 satır olsun.`;
  const out=await sample.json(prompt,{signal});
  if(!out||!Array.isArray(out.parts)||!out.parts.length)throw{code:"invalid_json"};return out}

function startSession(kind){
  if(kind==="all"){S.profile.format="all";save();kind="normal"}
  const t=activeTopic();const short=kind==="short";const B=kind==="B";
  const hasLesson=t&&t.kind!=="review"&&S.lessonFor[t.id];
  const due=dueFams();const repN=short?1:B?Math.min(5,due.length):Math.min(3,due.length);
  for(const k in P)delete P[k];
  Object.assign(P,{kind:"session",sk:kind,topic:t,ctl:new AbortController(),t0:Date.now(),phase:"plan",
    warm:null,warmErr:null,vocabNew:null,vocabErr:null,vrev:null,lesson:t&&t.kind!=="review"&&LESSONS[t.id]?{id:"L-"+t.id,title:t.t,fams:t.f,data:LESSONS[t.id],builtin:true}:hasLesson?NOTES.find(n=>n.id===S.lessonFor[t.id])||null:null,lessonErr:null,lessonPart:0,
    test:null,testErr:null,dropped:0,wi:0,ti:0,cards:{},res:[],fallback:false,vi:0,vst:null});
  P.needLesson=!S.tanima&&!short&&!B&&t&&t.kind!=="review"&&!P.lesson;if(S.tanima)P.lesson=null;
  P.phases=short?["plan","warm","vrev","test","eval"]:B?["plan","warm","test","eval"]:["plan","warm","vocab","vrev","lesson","test","eval"];
  if(!P.needLesson&&!P.lesson)P.phases=P.phases.filter(x=>x!=="lesson");
  P.due=due;P.repWarm=due.slice(0,Math.ceil(repN/2)||0);P.repTest=due.slice(Math.ceil(repN/2),repN);
  const prev=S.vocab.filter(v=>v.day<today()).sort((a,b)=>a.due<b.due?-1:1);P.vrev=prev.slice(0,5);if(!P.vrev.length)P.phases=P.phases.filter(x=>x!=="vrev");
  openPlayer();drawSession()}
function kickoff(){const sig=P.ctl.signal;const t=P.topic;const short=P.sk==="short";
  const repLine=(arr)=>repeatSpecs(arr,5);
  const fromDate=f=>{const m=lastMistakeOf(f);return m?fmtShort(dayOf(m.t)):null};
  const tagRep=qs=>qs.map(q=>q.rep?Object.assign(q,{repFrom:fromDate(q.fam)}):q);
  const wb=buildBankSet({n:short?3:6,warm:true,repFams:P.repWarm});
  if(wb)P.warm=tagRep(wb);else genSet({n:short?3:6,warm:true,repeats:repLine(P.repWarm),signal:sig}).then(qs=>{if(P.kind!=="session")return;P.warm=tagRep(qs);if(!qs.length)P.warmErr={code:"invalid_json"};drawSession()}).catch(e=>{if(P.kind!=="session"||e.code==="cancelled")return;P.warmErr=e;P.fallback=true;P.warm=shuffle(BANK).slice(0,3).map(prepBank);drawSession()});
  if(P.phases.includes("vocab"))genVocab(15,sig).then(v=>{if(P.kind!=="session")return;P.vocabNew=v;drawSession()}).catch(e=>{if(P.kind!=="session"||e.code==="cancelled")return;P.vocabErr=e;drawSession()});
  if(P.needLesson)genLesson(t,sig).then(async d=>{if(P.kind!=="session")return;const n={id:uid(),t:Date.now(),title:t.t,topic:t.id,fams:t.f,data:d};P.lesson=n;S.lessonFor[t.id]=n.id;save();await putNote(n);drawSession()}).catch(e=>{if(P.kind!=="session"||e.code==="cancelled")return;P.lessonErr=e;drawSession()});
  const n=short?5:16;const topicTitle=t?(t.kind==="review"?`karışık tekrar: en zayıf aileler (${P.due.slice(0,4).map(f=>FAMILIES[f].n).join(", ")||"genel"})`:t.t):"karışık tekrar";
  const unk=unknownFams();
  const tanExtra=S.tanima?` Bu bir TANIMA (teşhis) seti: öğrenciyi henüz tanımıyoruz. Soruları farklı ailelere ve bölümlere yay; özellikle şu ailelerden en az birer soru olsun: ${unk.map(f=>`${f} (${FAMILIES[f].n})`).join(", ")||"tüm aileler"}. Zorluk orta-gerçek YDS düzeyinde olsun.`:"";
  const tb=buildBankSet({n,topic:t&&t.kind!=="review"?t:null,repFams:P.repTest,tanima:S.tanima});

function toast(msg,ms=4200){const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${msg}</span>`;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),ms)}
let audioCtx;document.addEventListener("pointerdown",()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch{}},{once:true});
function chime(){try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.6);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.6)}catch{}}
const fired=new Set();
function checkReminders(){const p=S.profile;if(!p.remind)return;const now=new Date();const d=today();const hm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const fire=(key,time,msg)=>{if(fired.has(key+d)||hm<time)return;const late=(now.getHours()*60+now.getMinutes())-(+time.slice(0,2)*60+ +time.slice(3));fired.add(key+d);if(late<=30){toast(msg,15000);chime()}};
  if(p.days.includes(now.getDay())&&!sessionsOn(d).filter(s=>s.src!=="cowork").length&&!S.skips.includes(d))fire("s",p.time,`<b>${p.time}</b> YDS oturumu zamanı. Bugün: ${esc((activeTopic()||{t:"tekrar"}).t)}`);
  fire("v",p.vocabTime,`<b>${p.vocabTime}</b> 10 dakikalık kelime tekrarı.`);
