# Runs the Jest tests (including Supabase RLS tests against a local database)
# through test-hub's shared mobile-ci workflow, matches them with
# tests/catalog cards and, on main, opens or closes GitHub Issues here.
name: test-hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      issues: write
    uses: ferhanburak/test-hub/.github/workflows/mobile-ci.yml@main
    with:
      project: optik-sinav-kocu
      test-script: test:hub
      supabase: true
      suite: ${{ github.event_name == 'workflow_dispatch' && 'full' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'e2e' || 'fast' }}
